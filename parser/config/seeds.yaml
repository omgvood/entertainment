# Источники событий по городам.
#
# extraction_mode:
#   per_url         — дискавер N URL → N LLM-вызовов на каждое событие
#                     требует: kind + url + (опц.) url_pattern
#   batch_listing   — скачиваем url целиком и одним LLM-вызовом извлекаем все события
#                     требует: kind + url
#   direct_api      — вызываем API провайдера и маппим JSON → ParsedEvent напрямую (без LLM)
#                     требует: provider + api_query + event_type
#   vk_events       — VK-сообщества типа «событие» → ParsedEvent напрямую (без LLM)
#                     требует ПОЛЬЗОВАТЕЛЬСКИЙ токен (groups.search запрещён сервисному ключу) — отключён
#   vk_posts        — посты со стен vk_groups → префильтр → LLM extract_many (1 вызов/группу)
#                     требует: VK_SERVICE_KEY (wall.get) + vk_groups
#   telegram_posts  — посты публичных каналов (t.me/s/) → префильтр → LLM extract_many (1 вызов/канал)
#                     требует: telegram_sources (список каналов; без авторизации)
#   generic         — одобренные в candidate_sources домены → JSON-LD / LLM (длинный хвост)
#   playwright_listing — как batch_listing, но url рендерится headless-браузером (Playwright)
#                     требует: url + event_type. Для SPA (Nuxt/Next/React) — httpx видит пустой скелет
#
# priority — приоритет при кросс-источниковом merge (выше = побеждает, его карточка остаётся).

cities:
  sochi:
    sources:
      # QuizPlease Сочи (city_id=62 — api.quizplease.ru/api/games/schedule/62)
      - name: quizplease
        extraction_mode: direct_api
        provider: quizplease
        quizplease_city_id: 62
        priority: 60
        full_snapshot: true  # API обходит все страницы (_MAX_PAGES=20) → полный срез
        distinct_events: true  # у каждой игры свой id в API → две строки = две разные игры

      # 2ГИС — места «всегда» (Сочи)
      - name: twogis-bowling
        extraction_mode: direct_api
        provider: twogis
        api_query: "боулинг Сочи"
        event_type: bowling
        priority: 70

      - name: twogis-billiards
        extraction_mode: direct_api
        provider: twogis
        api_query: "бильярд Сочи"
        event_type: billiards
        priority: 70

      - name: twogis-karting
        extraction_mode: direct_api
        provider: twogis
        api_query: "картинг Сочи"
        event_type: karting
        priority: 70

      # Timepad — широкая афиша: тип события определяется по его категории Timepad
      - name: timepad
        extraction_mode: direct_api
        provider: timepad
        priority: 100

      # VK — события-сообщества (структурированные start_date/place, без LLM).
      # ОТКЛЮЧЁН: groups.search недоступен сервисному ключу mini-app (Access denied, code 15) —
      # нужен ПОЛЬЗОВАТЕЛЬСКИЙ токен. Код (sources/vk.py) и тесты готовы: раскомментировать,
      # если появится user-токен с правом groups.
      # - name: vk-events
      #   extraction_mode: vk_events
      #   priority: 80
      #   # vk_city_id: <проверить через database.getCities("Сочи")>

      # VK — посты кураторских сообществ (свободный текст, через LLM). Работает на сервисном
      # ключе (wall.get доступен). Screen-name'ы афиша-сообществ Сочи (без https://vk.com/).
      - name: vk-posts
        extraction_mode: vk_posts
        priority: 40
        vk_groups:
          - afishasochi24        
          - gidposochi       

      # KudaGo — пилот «широкой афиши» для Сочи. ОТКЛЮЧЁН: данные KudaGo по Сочи
      # устарели (проверено 2026-06-10) — с фильтром actual_since остаётся ~36 записей,
      # все из 2016 г. или без даты (is_startless). Источник возвращает 0 актуальных.
      # Клиент (sources/kudago.py) и диспетчер готовы — раскомментировать, если KudaGo
      # снова начнёт отдавать свежие события по Сочи.
      # - name: kudago
      #   extraction_mode: direct_api
      #   provider: kudago
      #   api_query: "sochi"
      #   priority: 50

      # Telegram — посты публичных каналов Сочи (зеркало perm, без авторизации).
      # Проверка: открой https://t.me/s/<channel> — должны показываться посты.
      - name: telegram-posts
        extraction_mode: telegram_posts
        priority: 45
        telegram_sources:
          - channel: afishasochi24       # афиша-агрегатор Сочи
            source_type: aggregator
            priority: 50
          - channel: gidposochi          # гид по Сочи (дублирует VK-группу) 
            source_type: aggregator
            priority: 50
            enabled: false              # не открывается в web, переход в приложение
          - channel: sochiweekend        # куда сходить в Сочи на выходных — проверено
            source_type: aggregator
            priority: 50
            enabled: true

      # Generic — одобренные в candidate_sources домены (длинный хвост).
      # Безопасно при пустом списке approved-доменов: 0 доменов → 0 LLM-вызовов.
      # Самоактивируется после discover-sources --city sochi + одобрения кандидатов.
      - name: generic
        extraction_mode: generic
        priority: 20

  perm:
    sources:
      # QuizPlease Пермь (city_id=37 — api.quizplease.ru/api/games/schedule/37)
      # Сайт — SPA (Nuxt), статический HTML не содержит событий → direct_api
      - name: quizplease
        extraction_mode: direct_api
        provider: quizplease
        quizplease_city_id: 37
        full_snapshot: true  # API обходит все страницы (_MAX_PAGES=20) → полный срез
        distinct_events: true  # у каждой игры свой id в API → две строки = две разные игры
        priority: 60

      # 2ГИС — места «всегда» (боулинг/бильярд/картинг)
      - name: twogis-bowling
        extraction_mode: direct_api
        provider: twogis
        api_query: "боулинг Пермь"
        event_type: bowling
        priority: 70

      - name: twogis-billiards
        extraction_mode: direct_api
        provider: twogis
        api_query: "бильярд Пермь"
        event_type: billiards
        priority: 70

      - name: twogis-karting
        extraction_mode: direct_api
        provider: twogis
        api_query: "картинг Пермь"
        event_type: karting
        priority: 70

      # 2ГИС — спортивные места «всегда» (скалодром/батут/теннис). Тот же провайдер twogis,
      # что и bowling/billiards/karting: текстовый поиск по Catalog API → venues (date='always').
      # event_type=sport (нет отдельных типов в EventType). Проверять по parse_warnings/coverage.
      - name: twogis-skalodrom
        extraction_mode: direct_api
        provider: twogis
        api_query: "скалодром Пермь"
        event_type: sport
        priority: 70

      - name: twogis-batut
        extraction_mode: direct_api
        provider: twogis
        api_query: "батутный центр Пермь"
        event_type: sport
        priority: 70

      - name: twogis-tenis
        extraction_mode: direct_api
        provider: twogis
        api_query: "теннисный клуб Пермь"
        event_type: sport
        priority: 70

      # Timepad — широкая афиша: тип события определяется по его категории Timepad
      - name: timepad
        extraction_mode: direct_api
        provider: timepad
        priority: 100

      # VK — события-сообщества (структурированные start_date/place, без LLM).
      # ОТКЛЮЧЁН: groups.search недоступен сервисному ключу mini-app (Access denied, code 15) —
      # нужен ПОЛЬЗОВАТЕЛЬСКИЙ токен. Код (sources/vk.py) и тесты готовы: раскомментировать,
      # если появится user-токен с правом groups.
      # - name: vk-events
      #   extraction_mode: vk_events
      #   priority: 80
      #   # vk_city_id: <проверить через database.getCities("Пермь")>

      # VK — посты кураторских сообществ (свободный текст, через LLM). Работает на сервисном
      # ключе (wall.get доступен). Screen-name'ы афиша-сообществ Перми (без https://vk.com/).
      - name: vk-posts
        extraction_mode: vk_posts
        priority: 40
        vk_groups:
          # Агрегаторы (куда сходить)
          - permactive         # активный досуг Перми
          - kudaperm            # куда пойти в Перми
          - prmgo
          - perm_where_to_go
          - permkudapoiti
          # Организаторы — выставки / экскурсии (покрывают пробел ❌→⚠️)
          - permartmuseum        # Пермская государственная художественная галерея
          - permm_museum              # PERMM — музей современного искусства
          # Организаторы — детские события
          - dollpermmuseum     # Пермский театр кукол
          # Организаторы — мастер-классы / арт
          - artspaceperm       # арт-пространства Перми
          # Спортклубы — анонсы матчей (сайты клубов — SPA, стены ВК ведутся регулярно).
          # Публичные группы, wall.get сервисным ключом должен работать — проверить в первом
          # прогоне (parse_warnings). Если стена только новости без дат — убрать (шум/квота).
          - volleykama        # ВК «Кама-Волей» (волейбол)
          - hc.molot          # ХК «Молот» (хоккей)
          - parmabasket       # БК «Парма» (баскетбол)

      # Telegram — посты публичных каналов (веб-превью t.me/s/, без авторизации).
      # source_type влияет на строгость префильтра: organizer (мало шума) — мягче,
      # aggregator (реклама/мемы/новости) — строже. priority/enabled управляют каналом
      # без правок кода. СПИСОК — СТАРТОВЫЙ, проверить/дополнить вручную (цель 15-20 каналов):
      # открой https://t.me/s/<channel> в браузере и убедись, что превью отдаёт посты.
      - name: telegram-posts
        extraction_mode: telegram_posts
        priority: 45
        telegram_sources:
          # Стендап-организаторы
          - channel: standupperm        # организатор стендапа — проверено
            source_type: organizer
            priority: 90
          # Афиша-агрегаторы
          - channel: kudaperm            # агрегатор — проверено
            source_type: aggregator
            priority: 50
          - channel: afishaperm          # агрегатор — проверено
            source_type: aggregator
            priority: 50
          - channel: happiness_perm             # арт-события Перми (уточнить)
            source_type: aggregator
            priority: 50
            enabled: true
          # Музеи / выставки / экскурсии (покрывают пробел ❌→⚠️)
          # Проверка: открой https://t.me/s/<channel> — должны показываться посты
          - channel: permartmuseum         # Пермская художественная галерея — проверено
            source_type: organizer
            priority: 80
            enabled: true
          - channel: permmmuseum        # PERMM — проверено
            source_type: organizer
            priority: 80
            enabled: true
          # Мастер-классы / арт-пространства

      # Generic — одобренные в candidate_sources домены (длинный хвост).
      # ВКЛЮЧЁН для Перми (эксперимент). Домены берутся из candidate_sources WHERE
      # status='approved'; бюджеты — GENERIC_DOMAIN_BUDGET / GENERIC_LLM_BUDGET в .env.
      - name: generic
        extraction_mode: generic
        priority: 20

      # SPA-сайты (Nuxt) — рендер headless-браузером (Playwright), затем JSON-LD → LLM.
      # Статический HTML у них пуст (httpx видит скелет), поэтому batch_listing не годится.
      # event_type — дефолт для JSON-LD, когда Schema.org @type не уточняет тип события.
      # priority 55: выше vk-posts/40 и generic/20, ниже quizplease/60 (первоисточник
      # организатора ценнее агрегаторских постов, но не перебивает профильный API).
      # permopera/permm — SPA с открытыми JSON-эндпоинтами под капотом → direct_api
      # (без браузера и без LLM). venue_name/address хардкодим тут: у каждой одна площадка.
      # full_snapshot: эндпоинты дают полный актуальный срез → sync удаляет снятые/отменённые.
      - name: permopera
        extraction_mode: direct_api
        provider: permopera
        event_type: concert
        venue_name: "Пермский театр оперы и балета им. П. И. Чайковского"
        address: "Пермь, ул. Петропавловская, 25а"
        priority: 55
        full_snapshot: true

      - name: permm
        extraction_mode: direct_api
        provider: permm
        event_type: exhibition
        venue_name: "Музей современного искусства ПЕРММ"
        address: "Пермь, бул. Гагарина, 24"
        priority: 55
        full_snapshot: true

      # ── КАНДИДАТЫ ИЗ seeds_editor-dobavleny_tochki_2gis.xlsx (СТАДИЯ РЕСЁРЧА) ──────────
      # Проверено httpx 2026-07-03: все нижеперечисленные сайты — JS-рендер (SPA), их
      # расписание НЕ попадает в статический HTML (0 дат в видимом тексте / данные спрятаны
      # в __NUXT__/__NEXT_DATA__). Значит batch_listing им не подходит — нужен
      # playwright_listing (в CI Playwright есть) ЛИБО отдельный direct_api-клиент к их
      # приватному API (эндпоинт /api/site/1.0/* — точный путь ищется через DevTools→Network).
      # Оставлены закомментированными: включать по одному ПОСЛЕ проверки, что рендер даёт
      # 3-5 реальных будущих событий (--dry-run). priority: клубы 90 (первоисточник матчей),
      # квизы 50 (ниже quizplease/60). full_snapshot ставить ТОЛЬКО при отсутствии пагинации.
      #
      # Спортклубы (Группа C):
      #   amkar-perm.ru — React SPA, «Ближайшие матчи» рендерится JS (видимый текст ~760 симв.)
      #   hc-molot.ru   — календарь-виджет, матчи подгружаются JS; сейчас межсезонье (июль)
      # - name: amkar-perm
      #   extraction_mode: playwright_listing
      #   url: https://amkar-perm.ru/matches/calendar
      #   event_type: sport
      #   priority: 90
      # - name: hc-molot
      #   extraction_mode: playwright_listing
      #   url: https://hc-molot.ru/?p=calendar
      #   event_type: sport
      #   priority: 90
      #
      # Квизы (Группа D):
      #   rudagames.com — Nuxt SPA (данные в __NUXT__), есть приватный /api/site/1.0/*
      #   perm.smuzi-quiz.com/games — Tilda, карточки игр подгружаются JS (0 дат в статике)
      #   perm.shakerquiz.ru — Next.js (данные в __NEXT_DATA__), есть приватный /api/site/1.0/*
      #   perm.wowquiz.ru — НЕ ДОБАВЛЯТЬ: пустой Nuxt-скелет (10КБ, 0 игр) — сайт мёртв/пуст
      # - name: rudagames-perm
      #   extraction_mode: playwright_listing
      #   url: https://rudagames.com/perm/schedule
      #   event_type: quiz
      #   priority: 50
      # - name: smuzi-quiz-perm
      #   extraction_mode: playwright_listing
      #   url: https://perm.smuzi-quiz.com/games
      #   event_type: quiz
      #   priority: 50
      # - name: shaker-quiz-perm
      #   extraction_mode: playwright_listing
      #   url: https://perm.shakerquiz.ru/
      #   event_type: quiz
      #   priority: 50

      # DeepSeek тестовый источник (раскомментировать для локального тестирования)
      # - name: quizplease-deepseek-test
      #   kind: listing
      #   url: https://perm.quizplease.ru/schedule
      #   extraction_mode: batch_listing
